# Copy to inventory.ini and fill in your nodes.
# ansible_host is the MANAGEMENT IP/hostname (Ansible connects over management, not fabric).
# fabric_ip and fabric_iface are per-node; rdma_dev is usually the same across nodes.
#
# Discover per node:
#   fabric_iface : ibdev2netdev   (the 5th column, e.g. enp1s0f0np0)
#   rdma_dev     : ibdev2netdev   (the 1st column, e.g. mlx5_0)
#   fabric_ip    : your chosen static fabric address (see docs/03-network-design.md)

[gb10]
gb10-01 ansible_host=10.0.0.11 fabric_ip=192.168.100.11 fabric_iface=enp1s0f0np0 rdma_dev=mlx5_0
gb10-02 ansible_host=10.0.0.12 fabric_ip=192.168.100.12 fabric_iface=enp1s0f0np0 rdma_dev=mlx5_0
# gb10-03 ansible_host=10.0.0.13 fabric_ip=192.168.100.13 fabric_iface=enp1s0f0np0 rdma_dev=mlx5_0
# gb10-04 ansible_host=10.0.0.14 fabric_ip=192.168.100.14 fabric_iface=enp1s0f0np0 rdma_dev=mlx5_0

[gb10:vars]
ansible_user=nvidia
ansible_python_interpreter=/usr/bin/python3
